name: Build

# Только проверочная сборка. Новые релизы публикуются на GitLab
# (scripts\publish.ps1 + Package Registry), GitHub остаётся зеркалом
# старых версий и не должен получать новые бинарники автоматически.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без буквы v, например 1.0.17'
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Тесты
        run: dotnet test --nologo

      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось установить Inno Setup' }

      - name: Сборка и упаковка
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          Write-Host "Версия: $version"
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          dotnet publish src/ExitBoost.App -c Release -r win-x64 --self-contained true `
            -p:Version=$version -o dist/ExitBoost --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Сборка приложения не удалась' }

          dotnet publish tools/ExitBoost.Cli -c Release -r win-x64 --self-contained true `
            -p:Version=$version -o dist/ExitBoost.Cli --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Сборка CLI не удалась' }

          dotnet publish tools/ExitBoost.Updater -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=None -p:DebugSymbols=false `
            -p:Version=$version -o dist/_updater --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Сборка updater-а не удалась' }
          Copy-Item dist/_updater/ExitBoost.Updater.exe dist/ExitBoost/ExitBoost.Updater.exe -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            "$pwd/dist/ExitBoost", "$pwd/dist/ExitBoost-$version-win-x64.zip",
            [System.IO.Compression.CompressionLevel]::Optimal, $false)
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            "$pwd/dist/ExitBoost.Cli", "$pwd/dist/ExitBoost.Cli-$version-win-x64.zip",
            [System.IO.Compression.CompressionLevel]::Optimal, $false)

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe не найден' }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$pwd/dist/ExitBoost" "/O$pwd/dist" 'installer/ExitBoost.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Сборка установщика не удалась' }
          if (-not (Test-Path "$pwd/dist/ExitBoost-$version-setup.exe")) { throw 'Установщик не создан' }

      - name: Артефакты (без публикации)
        uses: actions/upload-artifact@v4
        with:
          name: ExitBoost-${{ inputs.version }}-build
          path: |
            dist/ExitBoost-${{ inputs.version }}-setup.exe
            dist/ExitBoost-${{ inputs.version }}-win-x64.zip
            dist/ExitBoost.Cli-${{ inputs.version }}-win-x64.zip
